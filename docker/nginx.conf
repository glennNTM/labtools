server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sonde de santé (HEALTHCHECK du Dockerfile, orchestrateur).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés par Vite : nom haché, donc cache permanent.
    # Un asset absent renvoie une 404, pas la page d'accueil.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html toujours revalidé : un nouveau déploiement est pris en compte immédiatement.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Routes côté client (/mentions-legales, /cookies…) : renvoyées vers index.html.
    # La 404 des URL inconnues est affichée par l'application.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
